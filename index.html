<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="This website is temporarily unavailable while we carry out scheduled maintenance. Please check back soon."
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>Back soon — Maintenance in progress</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --background: #0b0d12;
        --muted: #9399a8;
        --text: #f2f3f7;
        --accent: #b9f36b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(ellipse at 50% 44%, rgb(37 44 34 / 34%), transparent 42%),
          var(--background);
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
        background-position: center center;
        background-size: 64px 64px;
        content: "";
        mask-image: linear-gradient(transparent, black 24%, black 76%, transparent);
        pointer-events: none;
      }

      .page {
        width: min(100% - 40px, 760px);
        padding: 56px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 64px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: #e4e6eb;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 10px;
        color: var(--accent);
        background: rgb(255 255 255 / 4%);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 999px;
        color: #c4c7d0;
        background: rgb(255 255 255 / 3%);
        font-size: 12px;
        font-weight: 500;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgb(185 243 107 / 70%);
        animation: pulse 2.4s ease-in-out infinite;
      }

      main {
        text-align: center;
      }

      .illustration {
        position: relative;
        display: grid;
        width: 164px;
        height: 164px;
        margin: 0 auto 36px;
        place-items: center;
      }

      .orbit {
        position: absolute;
        inset: 0;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 50%;
      }

      .orbit::before,
      .orbit::after {
        position: absolute;
        border: 1px solid rgb(255 255 255 / 6%);
        border-radius: 50%;
        content: "";
      }

      .orbit::before {
        inset: 13px;
      }

      .orbit::after {
        inset: 28px;
        background: radial-gradient(circle, rgb(185 243 107 / 9%), transparent 70%);
      }

      .orbit-spark {
        position: absolute;
        top: 18px;
        right: 22px;
        width: 8px;
        height: 8px;
        border: 2px solid var(--background);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px rgb(185 243 107 / 80%);
      }

      .tool-icon {
        z-index: 1;
        color: var(--accent);
        filter: drop-shadow(0 0 18px rgb(185 243 107 / 22%));
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0 auto;
        font-size: clamp(42px, 8vw, 72px);
        font-weight: 600;
        letter-spacing: -0.075em;
        line-height: 1.03;
      }

      h1 span {
        color: #9399a8;
      }

      .description {
        max-width: 440px;
        margin: 23px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.75;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 32px;
      }

      .retry-button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 18px;
        border: 0;
        border-radius: 9px;
        color: #11150b;
        background: var(--accent);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 160ms ease,
          background-color 160ms ease;
      }

      .retry-button:hover {
        transform: translateY(-2px);
        background: #c9ff83;
      }

      .retry-button:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }

      .divider {
        width: 100%;
        height: 1px;
        margin: 54px 0 20px;
        border: 0;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 11%), transparent);
      }

      footer {
        color: #717786;
        font-size: 12px;
        text-align: center;
      }

      @keyframes pulse {
        50% {
          opacity: 0.55;
          box-shadow: 0 0 5px rgb(185 243 107 / 45%);
        }
      }

      @media (max-width: 520px) {
        .page {
          width: min(100% - 36px, 760px);
          padding: 32px 0;
        }

        .topbar {
          margin-bottom: 54px;
        }

        .brand {
          font-size: 13px;
        }

        .status {
          gap: 7px;
          padding: 7px 9px;
          font-size: 11px;
        }

        .illustration {
          width: 140px;
          height: 140px;
          margin-bottom: 30px;
        }

        .description {
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar" aria-label="Website status">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3 4.5 7.5v9L12 21l7.5-4.5v-9L12 3Z"
                stroke="currentColor"
                stroke-linejoin="round"
                stroke-width="1.6"
              />
              <path
                d="m8.5 12 2.25 2.25L15.75 9"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.6"
              />
            </svg>
          </span>
          <span>BIGvault</span>
        </div>
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Maintenance in progress
        </div>
      </header>

      <main>
        <div class="illustration" aria-hidden="true">
          <span class="orbit"></span>
          <span class="orbit-spark"></span>
          <svg class="tool-icon" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path
              d="M29.4 11.4a10.5 10.5 0 0 0-13.1 13.1L7.6 33.2a4.25 4.25 0 0 0 6 6l8.7-8.7a10.5 10.5 0 0 0 13.1-13.1l-6.2 6.2-6.8-6.8 7-5.4Z"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
            <circle cx="11.5" cy="35.5" r="1.25" fill="currentColor" />
          </svg>
        </div>

        <p class="eyebrow">A little tune-up</p>
        <h1>We’ll be back <span>shortly.</span></h1>
        <p class="description">
          We’re making a few improvements behind the scenes. Thanks for your patience —
          everything will be up and running again soon.
        </p>
        <div class="actions">
          <button class="retry-button" type="button" onclick="window.location.reload()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M20 7v5h-5M4.9 9a8 8 0 0 1 13.3-2L20 12M4 17v-5h5m10.1 3a8 8 0 0 1-13.3 2L4 12"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
            Try again
          </button>
        </div>
      </main>

      <hr class="divider" />
      <footer>Thank you for bearing with us.</footer>
    </div>
  </body>
</html>
